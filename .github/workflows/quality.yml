name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        run: |
          rustup toolchain install 1.100 --profile minimal --component rustfmt,clippy
          rustup default 1.100

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app packages
        working-directory: app
        run: npm ci

      - name: Build the panel
        working-directory: app
        run: npm run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test the workspace
        env:
          BEACON_HOME: ${{ runner.temp }}\beacon\home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}\beacon\claude
          WEBVIEW2_USER_DATA_FOLDER: ${{ runner.temp }}\beacon\webview
        run: cargo test --workspace --locked

      - name: Test the panel
        working-directory: app
        run: npm test
