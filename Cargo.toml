[workspace]
resolver = "3"
members = ["crates/protocol", "crates/hook", "crates/core", "crates/cli", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
beacon-protocol = { path = "crates/protocol" }
beacon-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2" }
tokio = { version = "1", features = ["rt", "net", "io-util", "sync", "time", "macros", "process"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_System_Console",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 1
strip = false
