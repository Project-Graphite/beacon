<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Beacon walkthrough</title>
    <link rel="stylesheet" href="/preview/demo.css" />
  </head>
  <body>
    <div id="viewport">
      <div class="wallpaper"></div>
      <aside class="story">
        <div class="brand">
          <img src="/src-tauri/icons/128x128@2x.png" width="40" height="40" alt="" />
          <p class="brand-name">Beacon</p>
        </div>
        <p class="tagline">Every Claude Code session on your PC in one small panel.</p>
        <ol class="steps">
          <li>See every session at a glance</li>
          <li>Allow a permission request</li>
          <li>Answer a question</li>
          <li>Send a session a prompt</li>
        </ol>
      </aside>
      <div id="pill" class="pill"></div>
      <iframe id="panel" src="/" title="Beacon panel"></iframe>
      <div id="ripple"></div>
      <svg id="cursor" width="26" height="32" viewBox="0 0 26 32" aria-hidden="true">
        <path d="M3 2 L3 25 L9.2 19.6 L13.4 29 L17.6 27.1 L13.5 18 L22 18 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round" />
      </svg>
    </div>
    <script type="module" src="/preview/demo.ts"></script>
  </body>
</html>
